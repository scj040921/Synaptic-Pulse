server:
  port: ${PORT:8088}
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/synaptic;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
app:
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:8080,http://localhost:8081,http://localhost:5173,http://localhost:5174}
  ai:
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:}
    api-key: ${AI_API_KEY:}
